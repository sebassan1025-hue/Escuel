<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Escolar - Portal del Estudiante</title>
    <!-- CSS Separado -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <h1>Colegio Modelo Educativo</h1>
        <p>Portal de Gestión y Calificaciones</p>
    </header>

    <main class="container">
        <!-- Navegación de Pestañas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarPestana('registro')">Registro de Alumnos</button>
            <button class="tab-btn" onclick="cambiarPestana('boleta')">Consultar Boleta</button>
        </div>

        <!-- Sección de Registro -->
        <section id="seccion-registro" class="tab-content active">
            <h2>Registro de Nuevo Alumno</h2>
            <form id="formRegistro">
                <div class="form-group">
                    <label for="nombre">Nombre Completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="form-group">
                    <label for="matricula">Matrícula:</label>
                    <input type="text" id="matricula" name="matricula" required>
                </div>
                <div class="form-group">
                    <label for="grado">Grado / Grupo:</label>
                    <input type="text" id="grado" name="grado" required>
                </div>
                <div class="form-group">
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <button type="submit" class="btn-primary">Registrarse</button>
            </form>
            <div id="mensajeRegistro" class="mensaje"></div>
        </section>

        <!-- Sección de Boleta -->
        <section id="seccion-boleta" class="tab-content">
            <h2>Consulta de Calificaciones y Boleta</h2>
            <form id="formBoleta">
                <div class="form-group">
                    <label for="matriculaConsulta">Ingrese su Matrícula:</label>
                    <input type="text" id="matriculaConsulta" name="matricula" required>
                </div>
                <button type="submit" class="btn-primary">Consultar Boleta</button>
            </form>
            
            <!-- Contenedor donde se cargará la boleta -->
            <div id="resultadoBoleta" class="resultado-boleta"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Colegio Modelo Educativo. Todos los derechos reservados.</p>
    </footer>

    <!-- JavaScript Separado -->
    <script src="js/main.js"></script>
</body>
</html>
